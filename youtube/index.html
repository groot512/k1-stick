<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K1 Recipe Web — 유튜브 레시피 추출기로 이동 중 | Bitelabs</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://k1.bitelabs.kr/recipe/#/import">
  <meta http-equiv="refresh" content="0; url=../recipe/#/import">
  <style>
    :root {
      --cream: #f9f1e4;
      --paper: #fffdf9;
      --k1-red: #a92717;
      --k1-red-deep: #7f1b0f;
      --ink: #1a130f;
      --ink-75: rgba(26, 19, 15, 0.72);
      --line: rgba(26, 19, 15, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--cream);
      color: var(--ink);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(460px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2rem 1.75rem;
      text-align: center;
      box-shadow: 0 20px 50px -28px rgba(26, 19, 15, 0.3);
    }
    .badge {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--k1-red);
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.65rem;
    }
    p {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--ink-75);
      margin-bottom: 1.4rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      background: var(--k1-red);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .btn:hover { background: var(--k1-red-deep); }
  </style>
  <script>
    (function () {
      var target = '../recipe/' + (window.location.search || '') + '#/import';
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main class="card">
    <span class="badge">✦ K1 RECIPE WEB</span>
    <h1>통합 K1 유튜브 레시피 웹으로 이동합니다</h1>
    <p>자동으로 이동하지 않을 경우 아래 버튼을 눌러 K1 스틱소스 통합 유튜브 레시피 추출기로 바로 이동해 주세요.</p>
    <a class="btn" id="fallbackLink" href="../recipe/#/import">K1 유튜브 레시피 가져오기 열기 →</a>
  </main>
  <script>
    (function () {
      var link = document.getElementById('fallbackLink');
      if (link && window.location.search) {
        link.href = '../recipe/' + window.location.search + '#/import';
      }
    })();
  </script>
</body>
</html>
